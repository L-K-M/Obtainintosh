name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (check & build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      # The build writes the npm and font notices next to the bundle and
      # points every chunk at them; scripts/third-party-notices.mjs fails on
      # a bundled package or font without license text.
      - name: Check frontend license notices
        run: |
          notices=build/Third-Party-Notices.txt
          test -s "$notices"
          grep -q '^svelte ' "$notices"
          grep -q 'Sysfont' "$notices"
          grep -q 'Geneva 9.1' "$notices"
          grep -q 'SIL Open Font License' "$notices"
          test -n "$(find build/_app/immutable -name '*.js' -print -quit)"
          if grep -rL --include='*.js' 'Third-Party-Notices.txt' build/_app/immutable | grep .; then exit 1; fi

  rust:
    name: Rust (fmt, clippy, test — ${{ matrix.platform }})
    # Obtainintosh ships for macOS and Linux, and each OS has code the other
    # never compiles (`#[cfg(target_os = ...)]`: AppKit system colors and the
    # .app scanner on macOS; the dpkg/AppImage detection and D-Bus reveal on
    # Linux) — so lint and test on both real targets.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 needs the webkit2gtk 4.1 series (and friends) to compile on
      # Linux; macOS runners have everything out of the box.
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # src-tauri embeds the built frontend via `generate_context!`, so the
      # `build/` directory must exist before any cargo command touches it.
      - name: Build frontend (required by tauri::generate_context!)
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      # Every crate linked into a shipped binary must publish its license
      # text or have an override in licenses/rust-overrides.json. cargo tree
      # resolves every target from Linux, so one leg checks all three.
      - name: Check Rust license notices
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            python3 scripts/rust-notices.py --manifest-path src-tauri/Cargo.toml --target "$target" \
              --overrides licenses/rust-overrides.json --own-license MIT --check
          done

      # The crate lives in src-tauri/ (there is no root Cargo.toml), so every
      # cargo command must run from there.
      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --locked
        working-directory: src-tauri

  # Build the packages users download and check that the license notices are
  # inside them: the macOS app, and the Linux .deb and AppImage (the release
  # workflow builds the same bundles; the Flatpak job below repacks the .deb).
  bundles:
    name: Bundle notices (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: app
          - platform: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # As in release.yml; squashfs-tools for scripts/appimage-notices.py.
      - name: Install Tauri system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            squashfs-tools

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundles-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm ci

      # beforeBuildCommand runs scripts/notices.sh, and the bundle config
      # places its output in each package.
      - name: Build bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Check macOS app notices
        if: startsWith(matrix.platform, 'macos')
        run: |
          res=src-tauri/target/release/bundle/macos/Obtainintosh.app/Contents/Resources
          for f in LICENSE.txt Third-Party-Notices.txt Rust-Licenses.html; do
            test -s "$res/$f"
          done
          grep -q '^tauri ' "$res/Third-Party-Notices.txt"
          grep -q '^svelte ' "$res/Third-Party-Notices.txt"
          grep -q 'Geneva 9.1' "$res/Third-Party-Notices.txt"
          grep -q 'Copyright notices for The Rust Standard Library' "$res/Rust-Licenses.html"

      # The release workflow runs the same step before it uploads the AppImage.
      - name: Add the AppImage's system library notices
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          python3 scripts/appimage-notices.py appimage src-tauri/target/release/bundle/appimage/*.AppImage \
            --package obtainintosh --overrides licenses/linux/appimage-notices.json

      - name: Check Linux package notices
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          doc=usr/share/doc/obtainintosh
          tmp="$(mktemp -d)"
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$tmp/deb"
          appimage="$(realpath src-tauri/target/release/bundle/appimage/*.AppImage)"
          (cd "$tmp" && "$appimage" --appimage-extract 'usr/share/*' >/dev/null)
          for root in "$tmp/deb" "$tmp/squashfs-root"; do
            for f in copyright Third-Party-Notices.txt Rust-Licenses.html; do
              test -s "$root/$doc/$f"
            done
            test -s "$root/usr/share/metainfo/ch.lkmc.obtainintosh.metainfo.xml"
            grep -q '^License: MIT$' "$root/$doc/copyright"
            grep -q '^tauri ' "$root/$doc/Third-Party-Notices.txt"
            grep -q 'Geneva 9.1' "$root/$doc/Third-Party-Notices.txt"
          done
          # The AppImage also carries its Ubuntu libraries' and runtime's notices.
          test -s "$tmp/squashfs-root/$doc/SOURCES.txt"
          test -s "$tmp/squashfs-root/usr/share/doc/libglib2.0-0/copyright"
          grep -q 'Bundled system libraries' "$tmp/squashfs-root/$doc/Third-Party-Notices.txt"
          grep -q 'type2-runtime' "$tmp/squashfs-root/$doc/Third-Party-Notices.txt"

  # The release's Flatpak repacks a .deb built on Ubuntu 24.04;
  # scripts/build-flatpak.sh fails unless the notices reach /app/share/doc.
  flatpak:
    name: Flatpak notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri and Flatpak system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            flatpak flatpak-builder elfutils appstream
          # As in release.yml: let bubblewrap create user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net src-tauri/linux/ch.lkmc.obtainintosh.metainfo.xml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: flatpak

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the .deb and repack it as a Flatpak
        run: |
          npm run tauri -- build --bundles deb
          ./scripts/build-flatpak.sh src-tauri/target/release/bundle/deb/*.deb
