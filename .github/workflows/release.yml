name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Re-release an existing tag whose original run failed, without deleting and
  # re-pushing the tag. Runs the workflow file from the default branch but
  # builds the tagged commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release and upload assets

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the workflow_dispatch input.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Create a draft release that every build job uploads its artifacts into.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create draft release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          case "$RELEASE_TAG" in
            *-*) prerelease=true ;;
          esac
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --method POST \
            --raw-field tag_name="$RELEASE_TAG" \
            --raw-field name="Obtainintosh ${RELEASE_TAG}" \
            --field draft=true \
            --field prerelease="$prerelease" \
            --field generate_release_notes=true \
            --jq '.id')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Desktop bundles. Obtainintosh targets Mac OS X (.dmg-only bundle), so the
  # matrix covers macOS on Apple Silicon and Intel only.
  # ---------------------------------------------------------------------------
  build-desktop:
    name: Desktop (${{ matrix.platform }} ${{ matrix.args }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      # Explicit ref so workflow_dispatch re-releases build the tagged commit
      # rather than the default branch. On tag pushes this matches github.ref.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Install frontend dependencies
        run: npm ci

      # Referencing an unconfigured secret yields an empty string, and the
      # Tauri bundler treats a set-but-empty APPLE_CERTIFICATE as "signing
      # requested" — `security import` then fails the whole build. Export the
      # signing variables only when they actually have values, so unsigned
      # builds work without any secrets configured.
      - name: Enable code signing when secrets are configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "${name}<<__SIGNING_SECRET_EOF__"
                echo "$value"
                echo "__SIGNING_SECRET_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # Publish the release once every build job has finished successfully.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish release
    needs: [create-release, build-desktop]
    runs-on: ubuntu-22.04
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --method PATCH \
            --field draft=false
